name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid wasting minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: nova-x-desktop-0.2.0
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    working-directory: nova-x-desktop-0.2.0

jobs:
  quality:
    name: Lint & compile (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/requirements.txt
            ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install tooling
        run: python -m pip install --upgrade pip "ruff>=0.6"

      - name: Ruff (config in pyproject.toml)
        run: ruff check .

      - name: Byte-compile all sources
        run: python -m compileall -q nova tests app.py

      - name: Frontend JavaScript syntax
        run: node --check static/app.js

      - name: Debian packaging scripts are valid shell
        run: bash -n scripts/build_deb.sh scripts/install_user.sh scripts/uninstall_user.sh

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/requirements.txt
            ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install OpenSSH & Tor packages for §164/§165 live verification
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client tor

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Integration Testing Matrix (§114)
        run: python -m pytest tests/test_integration_matrix.py -q

      - name: Universal Creation Capability Suite (§148)
        run: python -m nova.creation --db "$RUNNER_TEMP/nova-uce.sqlite3" --workspace "$RUNNER_TEMP/nova-uce-ws"

      - name: Unified OS Master Acceptance Suite (§26)
        run: python -m nova.acceptance

      - name: System Access, Hardware & Continuous Autonomy Acceptance (§164)
        run: python -m nova.system_access.acceptance

      - name: Dark Web, Tor & Advanced Internet Intelligence Acceptance (§165)
        run: python -m nova.privacy_intel.acceptance

      - name: Corrected Master Hybrid Architecture Acceptance (§1-§11)
        run: python -m nova.hybrid_cloud.acceptance

      - name: Final Kali Expertise Acceptance (§200)
        run: python -m nova.kali_intel.acceptance

      - name: Final Security Engineering Acceptance (§220)
        run: python -m nova.cyber_division.acceptance

      - name: Final Autonomous Acquisition & Migration Acceptance (§235)
        run: python -m nova.acquisition_migration.acceptance

      - name: Pytest (full suite)
        run: python -m pytest -q

  intelligence-eval:
    # §86 general-intelligence evaluation suite. It is offline and deterministic:
    # no provider credentials are configured here, so a pass cannot depend on
    # network access or model quality. Held-out cases are run separately and must
    # never be usable as a baseline.
    name: Intelligence evaluation (nova-gie-v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/requirements.txt
            ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the default split
        run: python -m nova.cognition --db "$RUNNER_TEMP/nova-gie.sqlite3" --workspace "$RUNNER_TEMP/nova-gie-ws"

      - name: Run the held-out split
        run: python -m nova.cognition --include-held-out --db "$RUNNER_TEMP/nova-gie.sqlite3" --workspace "$RUNNER_TEMP/nova-gie-ws"

      - name: Held-out runs must not be savable as a baseline
        run: |
          if python -m nova.cognition --include-held-out --save-baseline "$RUNNER_TEMP/gie-held-out.json" \
               --db "$RUNNER_TEMP/nova-gie.sqlite3" --workspace "$RUNNER_TEMP/nova-gie-ws"; then
            echo "::error::a held-out run was accepted as a baseline"
            exit 1
          fi
          echo "refused as expected"

      - name: Baseline round-trip detects no regression
        run: |
          python -m nova.cognition --save-baseline "$RUNNER_TEMP/gie-baseline.json" \
            --db "$RUNNER_TEMP/nova-gie.sqlite3" --workspace "$RUNNER_TEMP/nova-gie-ws"
          python -m nova.cognition --baseline "$RUNNER_TEMP/gie-baseline.json" \
            --db "$RUNNER_TEMP/nova-gie.sqlite3" --workspace "$RUNNER_TEMP/nova-gie-ws"

  desktop-ui:
    # The native Qt window test skips on hosts without system graphics libraries.
    # GitHub runners ship libGL/libEGL, so this job is where that test really runs.
    name: Native desktop UI (Qt offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/requirements.txt
            ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install system graphics libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Pytest (Qt window test must run, not skip)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # pipefail matters here: without it the pipeline's status is tee's, so a
          # genuine pytest failure would be masked and only caught by the next step.
          set -euo pipefail
          python -m pytest tests/test_desktop_ui.py -q -rs | tee /tmp/qt-result.txt
          if grep -q "PySide6/Qt is unavailable" /tmp/qt-result.txt; then
            echo "::error::Qt UI test skipped on a runner that should support it."
            exit 1
          fi
          if ! grep -qE "[1-9][0-9]* passed" /tmp/qt-result.txt; then
            echo "::error::Qt UI test did not report any passing tests."
            exit 1
          fi

      - name: Full suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m nova.acceptance
          python -m pytest -q

  package:
    name: Build .deb and verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      # The CLI smoke test imports nova.desktop.runtime, which pulls in httpx and
      # pydantic. Without this the extracted launcher fails on a bare interpreter.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Debian package
        run: bash scripts/build_deb.sh

      - name: Verify packaged version matches pyproject.toml
        run: |
          set -euo pipefail
          PY_VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          DEB_PATH="$(ls releases/nova-x-desktop_*_all.deb | head -n 1)"
          DEB_VERSION="$(dpkg-deb --field "$DEB_PATH" Version)"
          PKG_VERSION="$(python -c 'import sys;sys.path.insert(0,".");import nova;print(nova.__version__)')"
          echo "pyproject=$PY_VERSION deb=$DEB_VERSION nova.__version__=$PKG_VERSION"
          test "$PY_VERSION" = "$DEB_VERSION"
          test "$PY_VERSION" = "$PKG_VERSION"

      - name: Verify package contents
        run: |
          set -euo pipefail
          DEB_PATH="$(ls releases/nova-x-desktop_*_all.deb | head -n 1)"
          dpkg-deb --contents "$DEB_PATH" | tee /tmp/deb-contents.txt
          grep -q "usr/bin/nova-x" /tmp/deb-contents.txt
          grep -q "usr/share/applications/nova-x.desktop" /tmp/deb-contents.txt
          grep -q "usr/lib/nova-x/nova/desktop/cli.py" /tmp/deb-contents.txt
          # Bytecode, caches, tests and local state must not be shipped.
          ! grep -q "__pycache__" /tmp/deb-contents.txt
          ! grep -q "\.pyc" /tmp/deb-contents.txt

      - name: Smoke test installed CLI
        run: |
          set -euo pipefail
          DEB_PATH="$(ls releases/nova-x-desktop_*_all.deb | head -n 1)"
          TMP="$(mktemp -d)"
          dpkg-deb --extract "$DEB_PATH" "$TMP"
          PYTHONPATH="$TMP/usr/lib/nova-x" python "$TMP/usr/bin/nova-x" --version

      - uses: actions/upload-artifact@v4
        with:
          name: nova-x-desktop-deb
          path: nova-x-desktop-0.2.0/releases/*.deb
          if-no-files-found: error
