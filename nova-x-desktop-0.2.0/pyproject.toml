[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-x-desktop"
version = "0.2.0"
description = "Local-first native Linux desktop assistant with scoped command execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6", "keyring>=24"]
server = ["fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0", "python-dotenv>=1,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
nova-x = "nova.desktop.cli:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
